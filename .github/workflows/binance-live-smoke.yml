name: Binance live archive smoke check

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market family to check"
        required: true
        type: choice
        options:
          - spot
          - usd-m
          - coin-m
      symbol:
        description: "One symbol/contract only (for example BTCUSDT)"
        required: true
        default: BTCUSDT
        type: string
      month:
        description: "One archive month in YYYY-MM format"
        required: true
        default: "2024-01"
        type: string

permissions:
  contents: read

jobs:
  live-archive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate bounded inputs
        env:
          MARKET: ${{ inputs.market }}
          SYMBOL: ${{ inputs.symbol }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]
          [[ "$SYMBOL" =~ ^[A-Za-z0-9_]{2,30}$ ]]
          mkdir -p artifacts
          printf 'market=%s\nsymbol=%s\nmonth=%s\n' "$MARKET" "$SYMBOL" "$MONTH" | tee artifacts/request.txt
      - name: Import one official archive month and verify checksum
        env:
          MARKET: ${{ inputs.market }}
          SYMBOL: ${{ inputs.symbol }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          python -m deta.cli --db artifacts/live-smoke.sqlite3 backfill-archive-klines \
            --market "$MARKET" --symbols "$SYMBOL" --intervals 1m \
            --start-month "$MONTH" --end-month "$MONTH" 2>&1 | tee artifacts/import.log
      - name: Reconcile live source listing against persisted manifest
        env:
          MARKET: ${{ inputs.market }}
          SYMBOL: ${{ inputs.symbol }}
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          python -m deta.cli --db artifacts/live-smoke.sqlite3 reconcile-archive-klines \
            --market "$MARKET" --symbol "$SYMBOL" --interval 1m \
            --start-month "$MONTH" --end-month "$MONTH" \
            | tee artifacts/source-manifest-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/source-manifest-reconciliation.json").read_text())
          problems = {
              "missing_from_manifest": report["missing_from_manifest"],
              "verified_but_not_imported": report["verified_but_not_imported"],
              "failed_archives": report["failed_archives"],
              "discovered_or_downloaded": report["discovered_or_downloaded"],
              "missing_checksum_or_size": report["missing_checksum_or_size"],
              "manifest_entries_not_in_current_source_listing": report[
                  "manifest_entries_not_in_current_source_listing"
              ],
          }
          problems = {key: value for key, value in problems.items() if value}
          if report["source_listed_archive_count"] == 0:
              raise SystemExit("FAIL: no source-listed archive found in requested scope")
          if len(report["imported_archives"]) != report["source_listed_archive_count"]:
              problems["source_listed_count_vs_imported_count"] = {
                  "source_listed": report["source_listed_archive_count"],
                  "imported": len(report["imported_archives"]),
              }
          if problems:
              print(json.dumps({"result": "FAIL", "problems": problems}, indent=2))
              raise SystemExit(1)
          print(json.dumps({
              "result": "PASS",
              "source_listed_archive_count": report["source_listed_archive_count"],
              "imported_archive_count": len(report["imported_archives"]),
              "scope": {
                  "market": report["market"],
                  "symbol": report["symbol"],
                  "interval": "1m",
                  "start_month": report["requested_months"]["start"],
                  "end_month": report["requested_months"]["end"],
              },
              "limitation": "Bounded live smoke evidence only; not proof of two-year or all-symbol coverage.",
          }, indent=2))
          PY
      - name: Record resulting dataset summary
        if: always()
        run: |
          if [[ -f artifacts/live-smoke.sqlite3 ]]; then
            python -m deta.cli --db artifacts/live-smoke.sqlite3 status | tee artifacts/status.json
            python -m deta.cli --db artifacts/live-smoke.sqlite3 archive-manifest | tee artifacts/archive-manifest.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-live-archive-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
