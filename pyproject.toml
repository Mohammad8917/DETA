[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deta-exchange-data"
version = "0.1.0"
description = "Resumable public market-data collection across cryptocurrency exchanges"
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
deta = "deta.cli:main"

[tool.setuptools.packages.find]
include = ["deta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["deta", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["deta", "tests"]
warn_unused_configs = true
no_implicit_reexport = true
