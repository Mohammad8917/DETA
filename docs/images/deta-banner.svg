<text x="64" y="204" fill="#f2f7ff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Collect. Validate. Preserve.</text>
<text x="64" y="241" fill="#b8cce5" font-family="Arial,Helvetica,sans-serif" font-size="18">Open-source Python tooling for historical crypto market data</text>
<text x="64" y="268" fill="#b8cce5" font-family="Arial,Helvetica,sans-serif" font-size="18">from public APIs and official exchange archives.</text>
